<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <button class="logo" onclick="App.go('home')" aria-label="Code Audio, retour à l'accueil">
        <span class="mark"><svg><use href="#logo"/></svg></span>
        <span class="logo-txt"><b>Code Audio</b><small>par Séraphin Antonio</small></span>
      </button>
      <div class="spacer"></div>
      <button class="iconbtn" title="Ma progression" aria-label="Ma progression" onclick="App.go('stats')"><svg class="i"><use href="#i-stats"/></svg></button>
      <button class="iconbtn" title="Réglages de la voix" aria-label="Réglages de la voix" onclick="App.openSettings()"><svg class="i"><use href="#i-sliders"/></svg></button>
    </div>
    <div id="topSlot"></div>
  </div>
  <div class="lane" id="lane" hidden></div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>
<footer class="credit wrap">Code Audio · créé par <b>Séraphin Antonio</b><br>Support pédagogique indépendant · ne remplace pas les textes officiels ni une formation agréée</footer>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle"><svg class="i"><use href="#i-sliders"/></svg>Réglages de la voix</h3>
    <div class="field">
      <label for="selVoice">Mode et voix de lecture</label>
      <select id="selVoice"></select>
      <div class="voice-state" id="voiceState"></div>
    </div>
    <div class="field">
      <label for="rngRate">Vitesse de lecture · <span class="rate-val" id="rateVal">0.94×</span></label>
      <input type="range" id="rngRate" min="0.70" max="1.25" step="0.02" value="0.94">
    </div>
    <div class="field">
      <label class="switch">
        <input type="checkbox" id="chkNatural" checked>
        <span>Rythme naturel et pauses entre question et réponses</span>
      </label>
    </div>
    <div class="field">
      <label class="switch">
        <input type="checkbox" id="chkAuto" checked>
        <span>Lecture automatique des questions et des réponses</span>
      </label>
    </div>
    <div class="field" style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost mini" style="flex:1" onclick="TTS.test()"><svg class="i sm"><use href="#i-speaker"/></svg>Tester le rendu</button>
      <button class="btn btn-ghost mini" style="flex:1" onclick="App.useNaturalVoice()">Réglage conseillé</button>
    </div>
    <div class="hint" id="voiceHint"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="App.closeSettings()">Fermer</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script src="visuals.js"></script>
<script src="images.js"></script>
<script src="ecf_data.js"></script>
<script src="tts.js"></script>
<script src="app.js"></script>
</body>
</html>
