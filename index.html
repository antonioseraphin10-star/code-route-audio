<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Code de la Route — Révision Audio · Permis B</title>
<meta name="description" content="Réviser le code de la route avec lecture vocale et suivi de progression.">
<meta name="theme-color" content="#1e3a8a">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<!-- iOS / iPadOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Code Audio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="logo" onclick="App.go('home')">
      <span class="badge">🚦</span>
      <span class="logo-txt">Code Audio<small>par Séraphin Antonio</small></span>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" title="Ma progression" onclick="App.go('stats')">📊</button>
    <button class="iconbtn" title="Réglages voix" onclick="App.openSettings()">⚙️</button>
  </header>
  <main id="app"></main>
  <footer class="credit">🚦 Code Audio · Créé par <b>Séraphin Antonio</b><br><span style="font-size:11px">Support pédagogique indépendant · ne remplace pas les textes officiels ni une formation agréée</span></footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>⚙️ Réglages de la voix</h3>
    <div class="field">
      <label>Mode et voix de lecture</label>
      <select id="selVoice"></select>
      <div class="voice-state" id="voiceState"></div>
    </div>
    <div class="field">
      <label>Vitesse de lecture · <span class="rate-val" id="rateVal">0.94×</span></label>
      <input type="range" id="rngRate" min="0.70" max="1.25" step="0.02" value="0.94">
    </div>
    <div class="field">
      <label class="switch">
        <input type="checkbox" id="chkNatural" checked>
        <span>Rythme naturel et pauses entre question et réponses</span>
      </label>
    </div>
    <div class="field">
      <label class="switch">
        <input type="checkbox" id="chkAuto" checked>
        <span>Lecture automatique des questions &amp; réponses</span>
      </label>
    </div>
    <div class="field" style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost mini" style="flex:1" onclick="TTS.test()">🔊 Tester le rendu</button>
      <button class="btn btn-ghost mini" style="flex:1" onclick="App.useNaturalVoice()">✨ Réglage conseillé</button>
    </div>
    <div class="hint" id="voiceHint"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="App.closeSettings()">Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script src="data.js"></script>
<script src="visuals.js"></script>
<script src="images.js"></script>
<script src="ecf_data.js"></script>
<script src="tts.js"></script>
<script src="app.js"></script>
</body>
</html>
