# Lance les contrôles automatiques à chaque envoi et chaque pull request :
# contenu (517 questions, 100 fiches), voix, application/PWA et moteur de quiz.
name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Action épinglée sur son empreinte (v5.0.1) pour éviter une substitution.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Version de Node
        run: node --version
      - name: Contrôles
        run: npm test
